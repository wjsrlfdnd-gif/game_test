name: Deploy Game to GitHub Pages

on:
  push:
    branches: ["main"]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Pages
        uses: actions/configure-pages@v5

      - name: Prepare site directory & stamp real-time version.json
        run: |
          mkdir -p _site
          cp random_character_defense.html _site/index.html
          cp random_character_defense.html _site/random_character_defense.html
          [ -f admin.html ] && cp admin.html _site/admin.html || true
          [ -f coupons.json ] && cp coupons.json _site/coupons.json || true
          [ -f sw.js ] && cp sw.js _site/sw.js || true
          [ -f manifest.webmanifest ] && cp manifest.webmanifest _site/manifest.webmanifest || true
          [ -f live_config.json ] && cp live_config.json _site/live_config.json || true
          [ -f supabase-config.js ] && cp supabase-config.js _site/supabase-config.js || true
          [ -d icons ] && cp -r icons _site/icons || true
          touch _site/.nojekyll

          python3 - <<'PY'
          import json, os, re, datetime
          html = open('random_character_defense.html', encoding='utf-8').read()
          m_build = re.search(r"APP_BUILD_ID\s*=\s*'([^']+)'", html)
          build_id = m_build.group(1) if m_build else '2026.11.24-mobile-live-v7'
          sw = open('sw.js', encoding='utf-8').read() if os.path.exists('sw.js') else ''
          m_cache = re.search(r"CACHE_NAME\s*=\s*'([^']+)'", sw)
          cache_name = m_cache.group(1) if m_cache else 'rcd-offline-v7'
          base = {}
          if os.path.exists('version.json'):
              try:
                  base = json.load(open('version.json', encoding='utf-8'))
              except Exception:
                  base = {}
          sha = (os.environ.get('GITHUB_SHA') or 'local')[:7]
          base.update({
              'buildId': build_id,
              'commit': sha,
              'cacheName': cache_name,
              'deployedAt': datetime.datetime.now(datetime.timezone.utc).strftime('%Y-%m-%dT%H:%M:%SZ'),
              'forceReload': bool(base.get('forceReload', False))
          })
          with open('_site/version.json', 'w', encoding='utf-8') as f:
              json.dump(base, f, ensure_ascii=False, indent=2)
          print('Stamped _site/version.json:', json.dumps(base, ensure_ascii=False))
          PY

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v4
        with:
          path: "_site"

  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
