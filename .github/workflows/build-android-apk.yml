name: Build Android Mobile Game APK

on:
  push:
    branches: ["main"]
    paths:
      - "mobile-app/**"
      - "icons/**"
      - ".github/workflows/build-android-apk.yml"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: "android-apk"
  cancel-in-progress: true

jobs:
  build-apk:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Setup Java 21
        uses: actions/setup-java@v4
        with:
          distribution: "temurin"
          java-version: "21"

      - name: Install Capacitor & Generate Android Project
        working-directory: mobile-app
        run: |
          npm install --no-audit --no-fund
          npx cap add android
          npm run prepare:android
          npx cap sync android

      - name: Build Android Debug APK
        working-directory: mobile-app/android
        run: |
          chmod +x gradlew
          ./gradlew assembleDebug --no-daemon

      - name: Copy Output APK
        run: |
          cp mobile-app/android/app/build/outputs/apk/debug/app-debug.apk RandomCharacterDefense.apk
          ls -lh RandomCharacterDefense.apk

      - name: Upload APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: RandomCharacterDefense-Android-APK
          path: RandomCharacterDefense.apk
          retention-days: 90

      - name: Publish Latest APK to GitHub Releases
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          TAG="android-latest"
          TITLE="랜덤 캐릭터 디펜스 모바일 앱 (Android APK)"
          cat <<'EOF' > /tmp/release_notes.md
          ## 📱 랜덤 캐릭터 디펜스 (Android APK)

          - **실시간 자동 업데이트 지원**: GitHub에 게임이 업데이트되면 APK를 다시 설치하지 않아도 앱 실행 중 자동으로 최신 버전이 반영됩니다.
          - **무재시작 실시간 공지·이벤트·쿠폰** 지원 (`live_config.json`)
          - **설치 방법**: 아래 `RandomCharacterDefense.apk` 다운로드 후 실행 (출처를 알 수 없는 앱 허용 필요)
          - **웹 / iOS PWA 설치**: https://wjsrlfdnd-gif.github.io/game_test/
          EOF

          if gh release view "$TAG" >/dev/null 2>&1; then
            gh release upload "$TAG" RandomCharacterDefense.apk --clobber
            gh release edit "$TAG" --title "$TITLE" --notes-file /tmp/release_notes.md --latest
          else
            gh release create "$TAG" RandomCharacterDefense.apk --title "$TITLE" --notes-file /tmp/release_notes.md --latest
          fi
