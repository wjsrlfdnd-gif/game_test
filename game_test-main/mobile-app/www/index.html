<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
  <title>랜덤 캐릭터 디펜스</title>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      min-height: 100dvh;
      display: flex;
      align-items: center;
      justify-content: center;
      background: radial-gradient(circle at 50% 25%, #1e293b 0%, #070b14 75%);
      color: #f8fafc;
      font-family: -apple-system, BlinkMacSystemFont, sans-serif;
      padding: 24px;
    }
    .card {
      max-width: 340px;
      width: 100%;
      background: rgba(15, 23, 42, 0.92);
      border: 1px solid rgba(251, 191, 36, 0.35);
      border-radius: 22px;
      padding: 26px 22px;
      text-align: center;
      box-shadow: 0 20px 45px rgba(0, 0, 0, 0.65);
    }
    .badge {
      width: 64px;
      height: 64px;
      margin: 0 auto 14px;
      border-radius: 18px;
      background: linear-gradient(135deg, #fbbf24, #f43f5e, #7c3aed);
      display: flex;
      align-items: center;
      justify-content: center;
      font-weight: 900;
      font-size: 20px;
      color: #070b14;
    }
    h1 { font-size: 18px; font-weight: 900; margin-bottom: 8px; }
    p { font-size: 13px; color: #94a3b8; line-height: 1.5; margin-bottom: 18px; }
    button {
      width: 100%;
      border: 0;
      border-radius: 14px;
      padding: 13px 16px;
      font-size: 14px;
      font-weight: 800;
      color: #070b14;
      background: linear-gradient(90deg, #fbbf24, #f97316);
      cursor: pointer;
    }
  </style>
</head>
<body>
  <div class="card">
    <div class="badge">RCD</div>
    <h1>실시간 게임 서버 연결 중...</h1>
    <p>최신 업데이트 서버에 접속하고 있습니다. 잠시만 기다려 주세요.</p>
    <button onclick="location.href='https://wjsrlfdnd-gif.github.io/game_test/?source=apk'">지금 연결하기</button>
  </div>
</body>
</html>
