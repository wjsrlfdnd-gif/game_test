<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
  <title>오프라인 — 랜덤 캐릭터 디펜스</title>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      min-height: 100dvh;
      display: flex;
      align-items: center;
      justify-content: center;
      background: radial-gradient(circle at 50% 25%, #1e293b 0%, #070b14 75%);
      color: #f8fafc;
      font-family: -apple-system, BlinkMacSystemFont, sans-serif;
      padding: 24px;
    }
    .card {
      max-width: 340px;
      width: 100%;
      background: rgba(15, 23, 42, 0.94);
      border: 1px solid rgba(244, 63, 94, 0.45);
      border-radius: 22px;
      padding: 26px 22px;
      text-align: center;
      box-shadow: 0 20px 45px rgba(0, 0, 0, 0.65);
    }
    .icon { font-size: 40px; margin-bottom: 10px; }
    h1 { font-size: 18px; font-weight: 900; margin-bottom: 8px; }
    p { font-size: 13px; color: #cbd5e1; line-height: 1.55; margin-bottom: 18px; }
    button {
      width: 100%;
      border: 0;
      border-radius: 14px;
      padding: 13px 16px;
      font-size: 14px;
      font-weight: 800;
      color: #070b14;
      background: linear-gradient(90deg, #34d399, #10b981);
      cursor: pointer;
    }
  </style>
</head>
<body>
  <div class="card">
    <div class="icon">📡</div>
    <h1>네트워크 연결을 확인해 주세요</h1>
    <p>최초 실행 및 실시간 업데이트 동기화를 위해 인터넷 연결이 필요합니다. Wi-Fi 또는 모바일 데이터를 켠 뒤 다시 시도해 주세요.</p>
    <button onclick="location.href='https://wjsrlfdnd-gif.github.io/game_test/?source=apk'">🔄 다시 연결하기</button>
  </div>
</body>
</html>
